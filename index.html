<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pdfrs — PDF editor in your browser</title>
    <meta name="description" content="Edit PDFs right in your browser, even offline: reorder, rotate, sign, merge, split and protect. Nothing to install, and no file is uploaded to any server.">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1f24" media="(prefers-color-scheme: dark)">
    <script src="/theme-boot.js"></script>
    <!--
      seo: the website's own tags, left out of the browser extension's build
      (see vite.config.ts), where SITE_URL, the site's address, is filled in.
    -->
    <link rel="canonical" href="%SITE_URL%">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="pdfrs">
    <meta property="og:title" content="pdfrs — PDF editor in your browser">
    <meta property="og:description" content="Runs entirely in your browser and works fully offline: nothing to install, and no file is ever uploaded to a server. Reorder, rotate, sign, merge, split and protect PDFs, for free.">
    <meta property="og:url" content="%SITE_URL%">
    <meta property="og:image" content="%SITE_URL%og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="pdfrs: edit PDFs right in your browser">
    <meta property="og:locale" content="en_US">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="pdfrs — PDF editor in your browser">
    <meta name="twitter:description" content="Runs entirely in your browser and works fully offline: nothing to install, and no file is ever uploaded to a server. Reorder, rotate, sign, merge, split and protect PDFs, for free.">
    <meta name="twitter:image" content="%SITE_URL%og-image.png">
    <meta name="twitter:image:alt" content="pdfrs: edit PDFs right in your browser">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "pdfrs",
        "url": "%SITE_URL%",
        "description": "A PDF editor that runs entirely in the browser, with WebAssembly: reorder, rotate, sign, annotate, merge, split and password-protect PDFs. Nothing to install, no account, no file is ever uploaded to a server, and it works fully offline.",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript and WebAssembly",
        "inLanguage": ["en", "it", "es", "de", "fr"],
        "image": "%SITE_URL%og-image.png",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
      }
    </script>
    <!-- /seo -->
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <h1>pdfrs — PDF editor in your browser</h1>
      <p>Reorder, rotate, sign, merge, split and protect PDFs right in your browser, even offline: nothing to install, and your files are never uploaded to any server. pdfrs needs JavaScript and WebAssembly: please turn JavaScript on to use it.</p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
