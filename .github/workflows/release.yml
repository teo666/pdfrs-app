# Makes a release: the browser extensions and the built app, as zips
# attached to a GitHub release.
#
#   pdfrs-chrome-<version>.zip    Chrome, Edge, Brave… (the Chrome Web Store / Edge Add-ons upload)
#   pdfrs-firefox-<version>.zip   Firefox (the addons.mozilla.org upload)
#   pdfrs-web-<version>.zip       the app, to put on any static web server, in any folder
#   pdfrs-source-<version>.zip    the sources of both repositories as built, with
#                                 BUILD.md: what addons.mozilla.org asks for to rebuild
#                                 the (minified) extension and compare it
#
# The engine is built from the pdfrs version in package.json ("pdfrs.ref"),
# so a release always has the same engine; by hand, another can be chosen.
#
# To release: set "version" in package.json (it is the extensions' version
# too), commit, then tag and push:  git tag v0.1.0 && git push origin v0.1.0
# The tag must match package.json.
#
# Run by hand (Actions → Release → Run workflow) it builds the same zips as
# the run's artifacts, without making a release: a dry run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pdfrs_ref:
        description: Branch, tag or commit of teo666/pdfrs to build the engine from (default, "pdfrs.ref" in package.json)
        default: ''


permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: pdfrs-app

      - name: Version
        id: version
        working-directory: pdfrs-app
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "pdfrs=${{ inputs.pdfrs_ref }}" >> "$GITHUB_OUTPUT"
          if [ -z "${{ inputs.pdfrs_ref }}" ]; then
            echo "pdfrs=$(node -p "require('./package.json').pdfrs.ref")" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./pdfrs-app/.github/actions/engine
        with:
          pdfrs-ref: ${{ steps.version.outputs.pdfrs }}

      - name: Unit tests
        working-directory: pdfrs-app
        run: pnpm test:unit --run

      - name: Extensions
        working-directory: pdfrs-app
        run: pnpm build:extension

      # Relative paths and routes in the hash (src/router/index.ts): the copy
      # works from any folder of any server.
      - name: Web app
        working-directory: pdfrs-app
        run: pnpm build --base ./ --outDir dist-web

      - name: Zips
        working-directory: pdfrs-app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir release
          cp dist-extension/pdfrs-chrome.zip "release/pdfrs-chrome-$VERSION.zip"
          cp dist-extension/pdfrs-firefox.zip "release/pdfrs-firefox-$VERSION.zip"
          (cd dist-web && zip -qr "../release/pdfrs-web-$VERSION.zip" .)
          ls -l release

      # The two repositories exactly as built, and how to build them again,
      # with the versions of every tool used here.
      - name: Sources
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PDFRS_REF: ${{ steps.version.outputs.pdfrs }}
        run: |
          mkdir -p source
          git -C pdfrs-app archive --format=tar --prefix=pdfrs-app/ HEAD | tar -x -C source
          git -C pdfrs archive --format=tar --prefix=pdfrs/ HEAD | tar -x -C source
          # Not in the pdfrs repository: the one this build resolved, so the
          # crates are the very same versions.
          cp pdfrs/Cargo.lock source/pdfrs/Cargo.lock
          cat > source/BUILD.md <<EOF
          # Building pdfrs $VERSION

          The extensions (\`pdfrs-chrome-$VERSION.zip\`, \`pdfrs-firefox-$VERSION.zip\`) are built from
          these two folders, which have to sit side by side: \`pdfrs-app\` (the app, commit
          $(git -C pdfrs-app rev-parse HEAD)) and \`pdfrs\` (the engine, $PDFRS_REF, commit
          $(git -C pdfrs rev-parse HEAD)).

          ## Tools, as used for this release

          - OS: $(lsb_release -ds 2>/dev/null || uname -sr)
          - Rust: $(rustc --version), target wasm32-unknown-unknown
          - wasm-pack: $(wasm-pack --version)
          - Node.js: $(node --version)
          - pnpm: $(pnpm --version)

          wasm-pack downloads wasm-bindgen and wasm-opt itself; npm packages come from
          the npm registry, Rust crates from crates.io, through the lockfiles
          (\`pdfrs/Cargo.lock\` is the one this release was built with).

          ## Commands

          \`\`\`sh
          rustup target add wasm32-unknown-unknown
          cd pdfrs && ./scripts/build-npm-package.sh && cd ..
          cd pdfrs/packages/pdfrs-editor && pnpm install --frozen-lockfile && cd ../../..
          cd pdfrs-app && pnpm install --frozen-lockfile && pnpm build:extension
          \`\`\`

          The result is in \`pdfrs-app/dist-extension/\`: \`firefox/\` and \`pdfrs-firefox.zip\`
          (the Firefox upload), \`chrome/\` and \`pdfrs-chrome.zip\`.
          EOF
          sed -i 's/^          //' source/BUILD.md
          (cd source && zip -qr "../pdfrs-app/release/pdfrs-source-$VERSION.zip" .)

      - uses: actions/upload-artifact@v7
        with:
          name: pdfrs-${{ steps.version.outputs.version }}
          path: pdfrs-app/release/*.zip

      - name: GitHub release
        if: github.ref_type == 'tag'
        working-directory: pdfrs-app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "pdfrs $VERSION" \
            --generate-notes
